[project]
name = "basana"
version = "1.11"
description = "A Python async and event driven framework for algorithmic trading, with a focus on crypto currencies."
authors = [{ name = "Gabriel Becedillas", email = "gabriel.becedillas@gmail.com" }]
requires-python = ">=3.13,<3.15"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp[speedups]>=3.14.5,<3.15",
    "python-dateutil>=2.9.0.post0,<3",
]

[project.optional-dependencies]
charts = [
    "plotly>=6.9.0,<7",
    "kaleido>=1.5.0,<2",
]
ccxt = [
    "ccxt>=4.5.85,<5",
]

[project.urls]
Homepage = "https://github.com/gbeced/basana"
Repository = "https://github.com/gbeced/basana"
Documentation = "https://basana.readthedocs.io/en/latest/"

[dependency-groups]
dev = [
    "aioresponses>=0.7.9,<0.8",
    "mypy>=1.20.2,<2",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "pytest-mock>=3.16.0,<4",
    "talipp>=2.7.0,<3",
    "types-python-dateutil>=2.9.0.20260807,<3",
    "websockets>=16.1.1,<17",
    "pandas>=2.3.3,<3",
    "statsmodels>=0.14.6,<0.15",
    "textual>=8.2.8,<9",
    "ruff>=0.15.22,<0.16",
    "invoke>=3.0.3",
]
docs = [
    "sphinx>=9.1.0,<10; python_version >= '3.11'",
    "sphinx-rtd-theme>=3.1.0,<4; python_version >= '3.11'",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["basana"]
module-root = "src"
source-include = ["vendor/**", "uv.lock", ".python-version"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
exclude = [
    "pocs",
    "vendor",  # Verified upstream source has its own lint policy.
]

[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set.
extend-select = ["E501"]


[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src", "."]
xfail_strict = true
filterwarnings = ["error"]
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
include = ["src/basana/*"]
exclude_lines = [
    "raise NotImplementedError()",
    "pragma: no cover",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"


[tool.uv.sources]
aioresponses = {path = "vendor/aioresponses"}
