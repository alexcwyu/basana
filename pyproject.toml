[project]
name = "basana"
version = "1.10.2"
description = "A Python async and event driven framework for algorithmic trading, with a focus on crypto currencies."
authors = [
    {name = "Gabriel Becedillas", email = "gabriel.becedillas@gmail.com"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp[speedups]>=3.13.5",
    "python-dateutil>=2.9.0.post0",
]

[project.optional-dependencies]
charts = [
    "plotly>=6.7.0",
    "kaleido>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/gbeced/basana"
Repository = "https://github.com/gbeced/basana"
Documentation = "https://basana.readthedocs.io/en/latest/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "talipp>=2.7.0",
    "types-python-dateutil>=2.9.0.20260408",
    "websockets>=16.0",
    "pandas>=2.3.3",
    "statsmodels>=0.14.6",
    "textual>=8.2.3",
    "ruff>=0.15.10",
    "sphinx>=9",
    "sphinx-rtd-theme>=3.0.2",
]

[tool.ruff]
line-length = 120
exclude = [
    "pocs"
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "TC", "PTH"]
extend-select = ["E501"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
include = ["src/basana/*"]
exclude_lines = [
    "raise NotImplementedError()",
    "pragma: no cover",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.hatch.build.targets.wheel]
packages = ["src/basana"]
